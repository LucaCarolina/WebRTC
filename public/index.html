<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cat Laser Pointer Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="status" class="status">Connecting...</div>
  <button id="retry-btn" class="retry-btn hidden">Retry</button>

  <div id="host-panel" class="panel hidden">
    <div id="qr" class="qr-box"></div>
    <canvas id="arena"></canvas>
  </div>

  <div id="phone-panel" class="panel hidden">
    <p class="instruction">Drag your finger to move the laser</p>
    <div id="touchpad">
      <div id="touch-dot" class="touch-dot hidden"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
