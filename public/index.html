<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cat Laser Pointer Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="status" class="status">Connecting...</div>
  <button id="retry-btn" class="retry-btn hidden">Retry</button>

  <div id="host-panel" class="panel hidden">
    <p class="host-hint hidden" id="host-hint">Host: keep this tab open. The QR opens <strong>mobile.html</strong> on the phone over <strong>https://</strong> (TLS certs in dev). Control runs over WebRTC.</p>
    <div id="qr" class="qr-box"></div>
    <canvas id="arena"></canvas>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="desktop.js"></script>
</body>
</html>
