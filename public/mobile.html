<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cat Laser Pointer Remote — Phone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="status" class="status">Connecting...</div>
  <button id="retry-btn" class="retry-btn hidden">Retry</button>

  <div id="phone-panel" class="panel hidden">
    <p class="instruction" id="phone-instruction">Phone: open the QR link (https). When Connected, use the touch pad, or tap once to allow tilt + microphone together.</p>
    <p class="phone-sub hidden" id="phone-sub" role="status"></p>
    <pre id="phone-perm-debug" class="phone-perm-debug hidden" aria-live="polite"></pre>
    <div id="phone-actions" class="phone-actions hidden">
      <button type="button" class="action-btn" id="btn-start-sensors">Allow tilt &amp; microphone</button>
    </div>
    <div id="hold-zone" class="hold-zone hidden" aria-label="Hold to activate laser">
      <span class="hold-zone-label">Hold here to aim the laser (tilt the phone while holding)</span>
    </div>
    <div id="touchpad">
      <div id="touch-dot" class="touch-dot hidden"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js" integrity="sha512-0f7Ahsuvr+/P2btTY4mZIw9Vl23lS6LY/Y7amdkmUg2dqsUF+cTe4QjWvj/NIBHJoGksOiqndKQuI9yzn2hB0g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="mobile.js"></script>
</body>
</html>
